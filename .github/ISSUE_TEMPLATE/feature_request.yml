name: Feature request
description: Propose a framework, compiler, tooling, or ecosystem improvement
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Gungnir's structured language is feature-frozen for the 1.0 release line. New syntax or semantics may be deferred for a later contract/version line.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or framework problem should this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the public behavior or developer experience, not only an implementation.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Language/compiler
        - HTTP/runtime
        - Database/ORM
        - Security
        - Tooling/CLI
        - Documentation/ecosystem
        - Other
    validations:
      required: true

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility impact
      description: Note whether this changes the 0.9 language, native API, generated code, packaging, or other public contracts.
