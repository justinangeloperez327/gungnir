name: Bug report
description: Report incorrect behavior in the current Gungnir implementation
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use this form for behavior that is implemented but incorrect. Design-only proposals belong in feature requests.

  - type: input
    id: version
    attributes:
      label: Gungnir version
      description: Output of gungnir --version
      placeholder: Gungnir 0.9.0
    validations:
      required: true

  - type: textarea
    id: contract
    attributes:
      label: Compiler contract
      description: Paste the output of gungnirc --print-contract
      render: text
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, compiler/toolchain, and CMake version
      placeholder: Windows 11 x86_64, MSVC 19.xx, CMake 4.x
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest source and exact commands needed to reproduce the problem.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: checkboxes
    id: security
    attributes:
      label: Security
      options:
        - label: This report does not contain undisclosed vulnerability details. Security issues follow SECURITY.md.
          required: true
