name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgresql:
    name: Integration · PostgreSQL
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gungnir
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gungnir"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GUNGNIR_POSTGRESQL_HOST: 127.0.0.1
      GUNGNIR_POSTGRESQL_PORT: "5432"
      GUNGNIR_POSTGRESQL_DATABASE: gungnir
      GUNGNIR_POSTGRESQL_USERNAME: postgres
      GUNGNIR_POSTGRESQL_PASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DGUNGNIR_BUILD_TOOLS=OFF
          -DGUNGNIR_WITH_POSTGRESQL=ON
          -DGUNGNIR_POSTGRESQL_INTEGRATION_TESTS=ON
      - name: Build adapter test
        run: cmake --build build --target gungnir_postgresql_integration_test --parallel
      - name: Test adapter
        run: ctest --test-dir build -R "^gungnir.postgresql$" --output-on-failure

  mysql:
    name: Integration · MySQL
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: gungnir
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmysql"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GUNGNIR_MYSQL_HOST: 127.0.0.1
      GUNGNIR_MYSQL_PORT: "3306"
      GUNGNIR_MYSQL_DATABASE: gungnir
      GUNGNIR_MYSQL_USERNAME: root
      GUNGNIR_MYSQL_PASSWORD: mysql
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y libmariadb-dev
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DGUNGNIR_BUILD_TOOLS=OFF
          -DGUNGNIR_WITH_MYSQL=ON
          -DGUNGNIR_MYSQL_INTEGRATION_TESTS=ON
      - name: Build adapter test
        run: cmake --build build --target gungnir_mysql_integration_test --parallel
      - name: Test adapter
        run: ctest --test-dir build -R "^gungnir.mysql$" --output-on-failure

  redis:
    name: Integration · Redis
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.10.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GUNGNIR_REDIS_HOST: 127.0.0.1
      GUNGNIR_REDIS_PORT: "6379"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install hiredis
        run: sudo apt-get update && sudo apt-get install -y libhiredis-dev
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DGUNGNIR_BUILD_TOOLS=OFF
          -DGUNGNIR_WITH_REDIS=ON
          -DGUNGNIR_REDIS_INTEGRATION_TESTS=ON
      - name: Build adapter test
        run: cmake --build build --target gungnir_redis_integration_test --parallel
      - name: Test adapter
        run: ctest --test-dir build -R "^gungnir.redis$" --output-on-failure

  tls:
    name: Integration · TLS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install OpenSSL
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DGUNGNIR_WITH_TLS=ON
      - name: Build TLS test
        run: cmake --build build --target gungnir_tls_server_test --parallel
      - name: Test TLS
        run: ctest --test-dir build -R "^gungnir.tls_server$" --output-on-failure
