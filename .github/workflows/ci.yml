name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate · compiler and generated application
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libsqlite3-dev
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DGUNGNIR_WITH_SQLITE=ON
      - name: Build validation targets
        run: >
          cmake --build build --parallel 2 --target
          gungnir_public_headers gungnir_project_tooling_test
          gungnir_frontend_diagnostics_test gungnir_structured_language_test
          gungnir_compiler_correctness_test gungnir_compiler_robustness_test
          gungnir_structured_generated_test gungnir_language_test
          gungnir_cli_test gungnir-cli gungnirc
      - name: Validate
        run: >
          ctest --test-dir build --output-on-failure --no-tests=error
          -R '^gungnir\.(project_tooling|frontend_diagnostics|structured_language|compiler_correctness|compiler_robustness|structured_generated|language|cli|lsp_protocol|cli_integration|compiler_profiles_cli)
  fuzz:
    name: Robustness · lexer and compiler fuzzing
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Clang and Ninja
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build
      - name: Configure fuzz build
        run: >
          cmake -S . -B build-fuzz -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DGUNGNIR_BUILD_TESTS=OFF
          -DGUNGNIR_BUILD_TOOLS=OFF
          -DGUNGNIR_BUILD_FUZZERS=ON
      - name: Build fuzz targets
        run: >
          cmake --build build-fuzz --parallel 2 --target
          gungnir_lexer_fuzzer gungnir_compiler_fuzzer
      - name: Run short fuzz campaign
        run: |
          mkdir -p fuzz-artifacts/lexer fuzz-artifacts/compiler
          ./build-fuzz/gungnir_lexer_fuzzer \
            tests/fuzz/corpus/lexer \
            -max_total_time=10 \
            -timeout=2 \
            -max_len=65536 \
            -rss_limit_mb=2048 \
            -artifact_prefix=fuzz-artifacts/lexer/
          ./build-fuzz/gungnir_compiler_fuzzer \
            tests/fuzz/corpus/compiler \
            -max_total_time=10 \
            -timeout=2 \
            -max_len=65536 \
            -rss_limit_mb=2048 \
            -artifact_prefix=fuzz-artifacts/compiler/
      - name: Upload fuzz crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-fuzz-crashes
          path: fuzz-artifacts/
          if-no-files-found: ignore

  postgresql:
    name: Integration · PostgreSQL
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gungnir
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gungnir"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GUNGNIR_POSTGRESQL_HOST: 127.0.0.1
      GUNGNIR_POSTGRESQL_PORT: "5432"
      GUNGNIR_POSTGRESQL_DATABASE: gungnir
      GUNGNIR_POSTGRESQL_USERNAME: postgres
      GUNGNIR_POSTGRESQL_PASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DGUNGNIR_BUILD_TOOLS=OFF
          -DGUNGNIR_WITH_POSTGRESQL=ON
          -DGUNGNIR_POSTGRESQL_INTEGRATION_TESTS=ON
      - name: Build adapter test
        run: cmake --build build --target gungnir_postgresql_integration_test --parallel
      - name: Test adapter
        run: ctest --test-dir build --no-tests=error -R "^gungnir.postgresql$" --output-on-failure

  mysql:
    name: Integration · MySQL
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: gungnir
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmysql"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GUNGNIR_MYSQL_HOST: 127.0.0.1
      GUNGNIR_MYSQL_PORT: "3306"
      GUNGNIR_MYSQL_DATABASE: gungnir
      GUNGNIR_MYSQL_USERNAME: root
      GUNGNIR_MYSQL_PASSWORD: mysql
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y libmariadb-dev
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DGUNGNIR_BUILD_TOOLS=OFF
          -DGUNGNIR_WITH_MYSQL=ON
          -DGUNGNIR_MYSQL_INTEGRATION_TESTS=ON
      - name: Build adapter test
        run: cmake --build build --target gungnir_mysql_integration_test --parallel
      - name: Test adapter
        run: ctest --test-dir build --no-tests=error -R "^gungnir.mysql$" --output-on-failure

