name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC Debug
            os: ubuntu-latest
            build_type: Debug
            compiler_args: -DCMAKE_CXX_COMPILER=g++
          - name: Linux Clang Debug
            os: ubuntu-latest
            build_type: Debug
            compiler_args: -DCMAKE_CXX_COMPILER=clang++
          - name: Windows MSVC Debug
            os: windows-latest
            build_type: Debug
            compiler_args: ""
          - name: Linux GCC Release
            os: ubuntu-latest
            build_type: Release
            compiler_args: -DCMAKE_CXX_COMPILER=g++

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build ${{ matrix.compiler_args }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  build-options:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Tests disabled
            tests: "OFF"
            tools: "ON"
          - name: Tools disabled
            tests: "ON"
            tools: "OFF"
          - name: Tests and tools disabled
            tests: "OFF"
            tools: "OFF"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DGUNGNIR_BUILD_TESTS=${{ matrix.tests }}
          -DGUNGNIR_BUILD_TOOLS=${{ matrix.tools }}

      - name: Build
        run: cmake --build build --parallel

  package-consumer:
    name: Installed package consumer
    runs-on: ubuntu-latest
    env:
      GUNGNIR_PREFIX: ${{ github.workspace }}/.gungnir-install
      GUNGNIR_GENERATED_SOURCE: ${{ github.workspace }}/.gungnir-package-consumer.cpp

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Gungnir
        run: >
          cmake -S . -B build-package
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX="$GUNGNIR_PREFIX"

      - name: Build Gungnir
        run: cmake --build build-package --parallel

      - name: Install Gungnir
        run: cmake --install build-package

      - name: Transpile external consumer
        run: >
          "$GUNGNIR_PREFIX/bin/gungnirc"
          tests/package-consumer/app.gnr
          -o "$GUNGNIR_GENERATED_SOURCE"

      - name: Configure external consumer
        run: >
          cmake -S tests/package-consumer -B build-consumer
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$GUNGNIR_PREFIX"
          -DGUNGNIR_CONSUMER_SOURCE="$GUNGNIR_GENERATED_SOURCE"

      - name: Build external consumer
        run: cmake --build build-consumer --parallel

      - name: Run external consumer
        run: ./build-consumer/gungnir-package-consumer

  postgresql:
    name: PostgreSQL adapter
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gungnir
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gungnir"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      GUNGNIR_PREFIX: ${{ github.workspace }}/.gungnir-postgresql-install
      GUNGNIR_POSTGRESQL_HOST: 127.0.0.1
      GUNGNIR_POSTGRESQL_PORT: "5432"
      GUNGNIR_POSTGRESQL_DATABASE: gungnir
      GUNGNIR_POSTGRESQL_USERNAME: postgres
      GUNGNIR_POSTGRESQL_PASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install libpq
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Configure PostgreSQL adapter
        run: >
          cmake -S . -B build-postgresql
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_INSTALL_PREFIX="$GUNGNIR_PREFIX"
          -DGUNGNIR_BUILD_TOOLS=OFF
          -DGUNGNIR_WITH_POSTGRESQL=ON
          -DGUNGNIR_POSTGRESQL_INTEGRATION_TESTS=ON

      - name: Build PostgreSQL adapter
        run: >
          cmake --build build-postgresql
          --target
          gungnir
          gungnir-orm
          gungnir-language
          gungnir-postgresql
          gungnir_postgresql_integration_test
          --parallel

      - name: Test PostgreSQL adapter
        run: >
          ctest --test-dir build-postgresql
          -R "^gungnir.postgresql$"
          --output-on-failure

      - name: Install PostgreSQL-enabled package
        run: cmake --install build-postgresql

      - name: Configure PostgreSQL package consumer
        run: >
          cmake
          -S tests/postgresql-package-consumer
          -B build-postgresql-consumer
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$GUNGNIR_PREFIX"

      - name: Build PostgreSQL package consumer
        run: cmake --build build-postgresql-consumer --parallel

      - name: Run PostgreSQL package consumer
        run: ./build-postgresql-consumer/gungnir-postgresql-package-consumer

  mysql:
    name: MySQL adapter
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: gungnir
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmysql"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      GUNGNIR_PREFIX: ${{ github.workspace }}/.gungnir-mysql-install
      GUNGNIR_MYSQL_HOST: 127.0.0.1
      GUNGNIR_MYSQL_PORT: "3306"
      GUNGNIR_MYSQL_DATABASE: gungnir
      GUNGNIR_MYSQL_USERNAME: root
      GUNGNIR_MYSQL_PASSWORD: mysql

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MySQL client development files
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb-dev

      - name: Configure MySQL adapter
        run: >
          cmake -S . -B build-mysql
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_INSTALL_PREFIX="$GUNGNIR_PREFIX"
          -DGUNGNIR_BUILD_TOOLS=OFF
          -DGUNGNIR_WITH_MYSQL=ON
          -DGUNGNIR_MYSQL_INTEGRATION_TESTS=ON

      - name: Build MySQL adapter
        run: >
          cmake --build build-mysql
          --target
          gungnir
          gungnir-orm
          gungnir-language
          gungnir-mysql
          gungnir_mysql_integration_test
          --parallel

      - name: Test MySQL adapter
        run: >
          ctest --test-dir build-mysql
          -R "^gungnir.mysql$"
          --output-on-failure

      - name: Install MySQL-enabled package
        run: cmake --install build-mysql

      - name: Configure MySQL package consumer
        run: >
          cmake
          -S tests/mysql-package-consumer
          -B build-mysql-consumer
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$GUNGNIR_PREFIX"

      - name: Build MySQL package consumer
        run: cmake --build build-mysql-consumer --parallel

      - name: Run MySQL package consumer
        run: ./build-mysql-consumer/gungnir-mysql-package-consumer

  sqlserver:
    name: SQL Server adapter
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: "Gungnir_SQL_2026!"
        ports:
          - 1433:1433

    env:
      GUNGNIR_PREFIX: ${{ github.workspace }}/.gungnir-sqlserver-install
      GUNGNIR_SQLSERVER_HOST: 127.0.0.1
      GUNGNIR_SQLSERVER_PORT: "1433"
      GUNGNIR_SQLSERVER_DATABASE: master
      GUNGNIR_SQLSERVER_USERNAME: sa
      GUNGNIR_SQLSERVER_PASSWORD: "Gungnir_SQL_2026!"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Microsoft ODBC Driver 18
        run: |
          curl -sSL -O "https://packages.microsoft.com/config/ubuntu/$(. /etc/os-release && echo "$VERSION_ID")/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          rm packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 mssql-tools18 unixodbc-dev

      - name: Wait for SQL Server
        run: |
          for attempt in {1..30}; do
            if /opt/mssql-tools18/bin/sqlcmd               -S 127.0.0.1,1433               -U sa               -P "$GUNGNIR_SQLSERVER_PASSWORD"               -C               -Q "SELECT 1" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "SQL Server did not become ready"
          exit 1

      - name: Configure SQL Server adapter
        run: >
          cmake -S . -B build-sqlserver
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_INSTALL_PREFIX="$GUNGNIR_PREFIX"
          -DGUNGNIR_BUILD_TOOLS=OFF
          -DGUNGNIR_WITH_SQLSERVER=ON
          -DGUNGNIR_SQLSERVER_INTEGRATION_TESTS=ON

      - name: Build SQL Server adapter
        run: >
          cmake --build build-sqlserver
          --target
          gungnir
          gungnir-orm
          gungnir-language
          gungnir-sqlserver
          gungnir_sqlserver_integration_test
          --parallel

      - name: Test SQL Server adapter
        run: >
          ctest --test-dir build-sqlserver
          -R "^gungnir.sqlserver$"
          --output-on-failure

      - name: Install SQL Server-enabled package
        run: cmake --install build-sqlserver

      - name: Configure SQL Server package consumer
        run: >
          cmake
          -S tests/sqlserver-package-consumer
          -B build-sqlserver-consumer
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$GUNGNIR_PREFIX"

      - name: Build SQL Server package consumer
        run: cmake --build build-sqlserver-consumer --parallel

      - name: Run SQL Server package consumer
        run: ./build-sqlserver-consumer/gungnir-sqlserver-package-consumer

  mongodb:
    name: MongoDB adapter
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.3.11
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 2)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      GUNGNIR_PREFIX: ${{ github.workspace }}/.gungnir-mongodb-install
      MONGOC_PREFIX: ${{ github.workspace }}/.mongo-c-driver-install
      GUNGNIR_MONGODB_HOST: 127.0.0.1
      GUNGNIR_MONGODB_PORT: "27017"
      GUNGNIR_MONGODB_DATABASE: gungnir

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build MongoDB C Driver 2.5.4
        run: |
          git clone             --depth 1             --branch 2.5.4             https://github.com/mongodb/mongo-c-driver.git             mongo-c-driver
          cmake             -S mongo-c-driver             -B mongo-c-driver-build             -DCMAKE_BUILD_TYPE=Release             -DBUILD_VERSION=2.5.4             -DENABLE_MONGOC=ON             -DENABLE_TESTS=OFF             -DENABLE_EXAMPLES=OFF             -DCMAKE_INSTALL_PREFIX="$MONGOC_PREFIX"
          cmake --build mongo-c-driver-build --parallel 2
          cmake --install mongo-c-driver-build

      - name: Configure MongoDB adapter
        run: >
          cmake -S . -B build-mongodb
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_INSTALL_PREFIX="$GUNGNIR_PREFIX"
          -DCMAKE_PREFIX_PATH="$MONGOC_PREFIX"
          -DGUNGNIR_BUILD_TOOLS=OFF
          -DGUNGNIR_WITH_MONGODB=ON
          -DGUNGNIR_MONGODB_INTEGRATION_TESTS=ON

      - name: Build MongoDB adapter
        run: >
          cmake --build build-mongodb
          --target
          gungnir
          gungnir-orm
          gungnir-language
          gungnir-mongodb
          gungnir_mongodb_integration_test
          --parallel

      - name: Test MongoDB adapter
        run: >
          ctest --test-dir build-mongodb
          -R "^gungnir.mongodb$"
          --output-on-failure

      - name: Install MongoDB-enabled package
        run: cmake --install build-mongodb

      - name: Configure MongoDB package consumer
        run: >
          cmake
          -S tests/mongodb-package-consumer
          -B build-mongodb-consumer
          -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_PREFIX_PATH=$GUNGNIR_PREFIX;$MONGOC_PREFIX"

      - name: Build MongoDB package consumer
        run: cmake --build build-mongodb-consumer --parallel

      - name: Run MongoDB package consumer
        run: ./build-mongodb-consumer/gungnir-mongodb-package-consumer

