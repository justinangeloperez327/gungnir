name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate · compiler, runtime, database and ORM correctness
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build libsqlite3-dev libssl-dev
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DGUNGNIR_WITH_SQLITE=ON
          -DGUNGNIR_WITH_PASSWORD=ON
      - name: Build validation targets
        run: >
          cmake --build build --parallel 2 --target
          gungnir_public_headers gungnir_public_api_contract_test
          gungnir_project_tooling_test
          gungnir_frontend_diagnostics_test gungnir_structured_language_test
          gungnir_framework_semantics_test
          gungnir_model_relationships_test gungnir_structured_orm_contract_test gungnir_structured_orm_test
          gungnir_compiler_correctness_test gungnir_compiler_stability_test
          gungnir_compiler_robustness_test gungnir_structured_generated_test
          gungnir_structured_http_test
          gungnir_structured_authentication_test
          gungnir_structured_services_test
          gungnir_structured_routing_test
          gungnir_structured_validation_test
          gungnir_structured_background_test
          gungnir_structured_application_test
          gungnir_structured_delivery_test
          gungnir_structured_request_context_test
          gungnir_language_test
          gungnir_runtime_safety_test gungnir_timer_runtime_test
          gungnir_http_reactor_test gungnir_http_server_test
          gungnir_http_streaming_test gungnir_websocket_test
          gungnir_runtime_supervisor_test gungnir_runtime_host_test
          gungnir_runtime_lifecycle_test
          gungnir_production_resilience_test gungnir_http_overload_test
          gungnir_security_test gungnir_security_hardening_test
          gungnir_csrf_test gungnir_auth_session_test
          gungnir_session_lifecycle_test gungnir_view_security_test
          gungnir_database_correctness_test gungnir_orm_correctness_test
          gungnir_sqlite_correctness_test gungnir_database_cancellation_test
          gungnir_database_scope_safety_test gungnir_orm_transaction_test
          gungnir_orm_relations_test gungnir_orm_soft_deletes_test
          gungnir_orm_timestamps_test
          gungnir_cli_test gungnir-cli gungnirc
      - name: Validate
        run: >
          ctest --test-dir build --output-on-failure --no-tests=error
          -R '^gungnir\.(public_api_contract|project_tooling|frontend_diagnostics|structured_language|framework_semantics|model_relationships|structured_orm_contract|structured_orm|compiler_correctness|compiler_stability|compiler_robustness|structured_generated|structured_http|structured_authentication|structured_services|structured_routing|structured_validation|structured_background|structured_application|structured_delivery|docs_delivery_examples|docs_application_examples|docs_background_examples|docs_service_examples|docs_routing_examples|docs_validation_examples|docs_auth_examples|structured_request_context|language|cli|docs_orm_examples|docs_http_examples|docs_context_examples|lsp_protocol|cli_integration|compiler_profiles_cli|compiler_release_contract|compiler_conformance_snapshot|runtime_safety|timer_runtime|http_reactor|http_server|http_streaming|websocket|runtime_supervisor|runtime_host|runtime_lifecycle|production_resilience|http_overload|security|security_hardening|csrf|auth_session|session_lifecycle|view_security|database_correctness|orm_correctness|sqlite_correctness|database_cancellation|database_scope_safety|orm_transaction|orm_relations|orm_soft_deletes|orm_timestamps)$'
      - name: Build and run generated ORM against the installed package
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/gungnir-orm"
          cmake -S tests/install_smoke -B installed-orm -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/gungnir-orm" \
            -DGUNGNIR_STRUCTURED_ORM_GENERATED="$PWD/build/generated/structured_orm_program.cpp"
          cmake --build installed-orm --parallel 2
          ./installed-orm/gungnir_install_smoke
          ./installed-orm/gungnir_installed_orm_contract
          ./installed-orm/gungnir_installed_orm
      - name: Build and run generated HTTP against installed package
        run: |
          cmake --install build --prefix "$PWD/build/install"
          cmake -S tests/install_smoke -B build/install-http -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$PWD/build/install" \
            -DGUNGNIR_STRUCTURED_HTTP_GENERATED="$PWD/build/generated/structured_http_program.cpp"
          cmake --build build/install-http --parallel 2
          ./build/install-http/gungnir_install_smoke
          ./build/install-http/gungnir_installed_http
      - name: Build and run generated request context against installed package
        run: |
          cmake --install build --prefix "$PWD/build/install"
          cmake -S tests/install_smoke -B build/install-context -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$PWD/build/install" \
            -DGUNGNIR_STRUCTURED_CONTEXT_GENERATED="$PWD/build/generated/structured_context_program.cpp"
          cmake --build build/install-context --parallel 2
          ./build/install-context/gungnir_install_smoke
          ./build/install-context/gungnir_installed_context
      - name: Build and run generated authentication against installed package
        run: |
          cmake --install build --prefix "$PWD/build/install"
          cmake -S tests/install_smoke -B build/install-authentication -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$PWD/build/install" \
            -DGUNGNIR_STRUCTURED_AUTH_GENERATED="$PWD/build/generated/structured_authentication_program.cpp"
          cmake --build build/install-authentication --parallel 2
          ./build/install-authentication/gungnir_install_smoke
          ./build/install-authentication/gungnir_installed_authentication
      - name: Build and run generated services against installed package
        run: |
          cmake --install build --prefix "$PWD/build/install"
          cmake -S tests/install_smoke -B build/install-services -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$PWD/build/install" \
            -DGUNGNIR_STRUCTURED_SERVICES_GENERATED="$PWD/build/generated/structured_services_program.cpp"
          cmake --build build/install-services --parallel 2
          ./build/install-services/gungnir_install_smoke
          ./build/install-services/gungnir_installed_services
      - name: Build and run generated routing against installed package
        run: |
          cmake --install build --prefix "$PWD/build/install"
          cmake -S tests/install_smoke -B build/install-routing -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$PWD/build/install" \
            -DGUNGNIR_STRUCTURED_ROUTING_GENERATED="$PWD/build/generated/structured_routing_program.cpp"
          cmake --build build/install-routing --parallel 2
          ./build/install-routing/gungnir_install_smoke
          ./build/install-routing/gungnir_installed_routing
      - name: Build and run generated validation against installed package
        run: |
          cmake --install build --prefix "$PWD/build/install"
          cmake -S tests/install_smoke -B build/install-validation -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$PWD/build/install" \
            -DGUNGNIR_STRUCTURED_VALIDATION_GENERATED="$PWD/build/generated/structured_validation_program.cpp"
          cmake --build build/install-validation --parallel 2
          ./build/install-validation/gungnir_install_smoke
          ./build/install-validation/gungnir_installed_validation
      - name: Build and run generated background against installed package
        run: |
          cmake --install build --prefix "$PWD/build/install"
          cmake -S tests/install_smoke -B build/install-background -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$PWD/build/install" \
            -DGUNGNIR_STRUCTURED_BACKGROUND_GENERATED="$PWD/build/generated/structured_background_program.cpp"
          cmake --build build/install-background --parallel 2
          ./build/install-background/gungnir_install_smoke
          ./build/install-background/gungnir_installed_background
      - name: Build and run generated application against installed package
        run: |
          cmake --install build --prefix "$PWD/build/install"
          cmake -S tests/install_smoke -B build/install-application -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$PWD/build/install" \
            -DGUNGNIR_STRUCTURED_APPLICATION_GENERATED="$PWD/build/generated/structured_application_program.cpp"
          cmake --build build/install-application --parallel 2
          ./build/install-application/gungnir_install_smoke
          ./build/install-application/gungnir_installed_application
      - name: Build and run generated delivery against installed package
        run: |
          cmake --install build --prefix "$PWD/build/install"
          cmake -S tests/install_smoke -B build/install-delivery -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$PWD/build/install" \
            -DGUNGNIR_STRUCTURED_DELIVERY_GENERATED="$PWD/build/generated/structured_delivery_program.cpp"
          cmake --build build/install-delivery --parallel 2
          ./build/install-delivery/gungnir_install_smoke
          ./build/install-delivery/gungnir_installed_delivery
      - name: Configure sanitizer fuzz build
        run: >
          cmake -S . -B build-fuzz -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DGUNGNIR_BUILD_TESTS=OFF
          -DGUNGNIR_BUILD_TOOLS=OFF
          -DGUNGNIR_BUILD_FUZZERS=ON
      - name: Build fuzz targets
        run: >
          cmake --build build-fuzz --parallel 2 --target
          gungnir_lexer_fuzzer gungnir_compiler_fuzzer
      - name: Run sanitizer fuzz smoke campaign
        env:
          ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        run: |
          ./build-fuzz/gungnir_lexer_fuzzer \
            tests/fuzz/corpus/lexer \
            -max_total_time=10 -timeout=2 -max_len=65536 -rss_limit_mb=2048
          ./build-fuzz/gungnir_compiler_fuzzer \
            tests/fuzz/corpus/compiler \
            -max_total_time=10 -timeout=2 -max_len=65536 -rss_limit_mb=2048


  postgresql:
    name: Integration · PostgreSQL
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gungnir
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gungnir"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GUNGNIR_POSTGRESQL_HOST: 127.0.0.1
      GUNGNIR_POSTGRESQL_PORT: "5432"
      GUNGNIR_POSTGRESQL_DATABASE: gungnir
      GUNGNIR_POSTGRESQL_USERNAME: postgres
      GUNGNIR_POSTGRESQL_PASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DGUNGNIR_BUILD_TOOLS=OFF
          -DGUNGNIR_WITH_POSTGRESQL=ON
          -DGUNGNIR_POSTGRESQL_INTEGRATION_TESTS=ON
      - name: Build adapter test
        run: cmake --build build --target gungnir_postgresql_integration_test --parallel
      - name: Test adapter
        run: ctest --test-dir build --no-tests=error -R "^gungnir.postgresql$" --output-on-failure

  mysql:
    name: Integration · MySQL
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: gungnir
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmysql"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GUNGNIR_MYSQL_HOST: 127.0.0.1
      GUNGNIR_MYSQL_PORT: "3306"
      GUNGNIR_MYSQL_DATABASE: gungnir
      GUNGNIR_MYSQL_USERNAME: root
      GUNGNIR_MYSQL_PASSWORD: mysql
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y libmariadb-dev
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DGUNGNIR_BUILD_TOOLS=OFF
          -DGUNGNIR_WITH_MYSQL=ON
          -DGUNGNIR_MYSQL_INTEGRATION_TESTS=ON
      - name: Build adapter test
        run: cmake --build build --target gungnir_mysql_integration_test --parallel
      - name: Test adapter
        run: ctest --test-dir build --no-tests=error -R "^gungnir.mysql$" --output-on-failure

  redis:
    name: Integration · Redis
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.10.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GUNGNIR_REDIS_HOST: 127.0.0.1
      GUNGNIR_REDIS_PORT: "6379"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install hiredis
        run: sudo apt-get update && sudo apt-get install -y libhiredis-dev libsqlite3-dev libssl-dev libcurl4-openssl-dev ninja-build
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DGUNGNIR_BUILD_TOOLS=ON
          -DGUNGNIR_WITH_REDIS=ON
          -DGUNGNIR_REDIS_INTEGRATION_TESTS=ON
          -DGUNGNIR_WITH_SQLITE=ON
          -DGUNGNIR_WITH_PASSWORD=ON
          -DGUNGNIR_WITH_SMTP=ON
          -DCURL_LIBRARY=/usr/lib/x86_64-linux-gnu/libcurl.so
          -DCURL_INCLUDE_DIR=/usr/include/x86_64-linux-gnu
      - name: Build adapter test
        run: cmake --build build --target gungnir_redis_integration_test gungnir-smtp gungnir-orm gungnir-cli gungnirc --parallel 2
      - name: Test adapter
        run: ctest --test-dir build --no-tests=error -R '^gungnir\.(redis|background_redis|application_redis|delivery_redis)$' --output-on-failure

  tls:
    name: Integration · TLS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install OpenSSL
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DGUNGNIR_WITH_TLS=ON
      - name: Build TLS test
        run: cmake --build build --target gungnir_tls_server_test --parallel
      - name: Test TLS
        run: ctest --test-dir build --no-tests=error -R "^gungnir.tls_server$" --output-on-failure
