name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package, for example v0.1.0
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  build-linux:
    name: Package · Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate tag version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must use SemVer, for example v0.1.0 or v0.1.0-rc.1."
            exit 1
          fi

          tag_version="${BASH_REMATCH[1]}"
          cmake_version="$(
            sed -nE 's/^[[:space:]]*project\(gungnir VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt
          )"

          if [[ -z "$cmake_version" ]]; then
            echo "Unable to read the Gungnir version from CMakeLists.txt."
            exit 1
          fi

          if [[ "$tag_version" != "$cmake_version" ]]; then
            echo "Tag version $tag_version does not match CMake project version $cmake_version."
            exit 1
          fi

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGUNGNIR_BUILD_TESTS=OFF
          -DGUNGNIR_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Install
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          package="gungnir-v${version}-linux-x86_64"
          prefix="$GITHUB_WORKSPACE/dist/$package"

          cmake --install build --prefix "$prefix"
          cp README.md LICENSE "$prefix/"

          echo "GUNGNIR_PACKAGE=$package" >> "$GITHUB_ENV"
          echo "GUNGNIR_PREFIX=$prefix" >> "$GITHUB_ENV"

      - name: Smoke test installed package
        shell: bash
        run: |
          set -euo pipefail

          cmake -S tests/install_smoke -B install-smoke-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GUNGNIR_PREFIX"
          cmake --build install-smoke-build --parallel 2

          actual_version="$("$GUNGNIR_PREFIX/bin/gungnir" --version)"
          tag_core="${RELEASE_TAG#v}"
          tag_core="${tag_core%%-*}"
          expected_version="Gungnir $tag_core"

          if [[ "$actual_version" != "$expected_version" ]]; then
            echo "Installed CLI reports '$actual_version'; expected '$expected_version'."
            exit 1
          fi

      - name: Create archive
        shell: bash
        run: |
          set -euo pipefail
          tar -C "$GITHUB_WORKSPACE/dist" \
            -czf "$GITHUB_WORKSPACE/${GUNGNIR_PACKAGE}.tar.gz" \
            "$GUNGNIR_PACKAGE"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: ${{ env.GUNGNIR_PACKAGE }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Package · Windows x86_64
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate tag version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+)(?:-[0-9A-Za-z.-]+)?$') {
              throw "Release tag must use SemVer, for example v0.1.0 or v0.1.0-rc.1."
          }

          $tagVersion = $Matches[1]
          $cmake = Get-Content CMakeLists.txt -Raw

          if ($cmake -notmatch 'project\(gungnir VERSION (\d+\.\d+\.\d+)') {
              throw "Unable to read the Gungnir version from CMakeLists.txt."
          }

          $cmakeVersion = $Matches[1]

          if ($tagVersion -ne $cmakeVersion) {
              throw "Tag version $tagVersion does not match CMake project version $cmakeVersion."
          }

      - name: Configure
        run: >
          cmake -S . -B build -A x64
          -DGUNGNIR_BUILD_TESTS=OFF
          -DGUNGNIR_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Install
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $package = "gungnir-v$version-windows-x86_64"
          $prefix = Join-Path $env:GITHUB_WORKSPACE "dist\$package"

          cmake --install build --config Release --prefix "$prefix"
          Copy-Item README.md, LICENSE -Destination "$prefix"

          "GUNGNIR_PACKAGE=$package" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GUNGNIR_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Smoke test installed package
        shell: pwsh
        run: |
          cmake -S tests/install_smoke -B install-smoke-build -A x64 `
            "-DCMAKE_PREFIX_PATH=$env:GUNGNIR_PREFIX"
          cmake --build install-smoke-build --config Release --parallel 2

          $actualVersion = (& "$env:GUNGNIR_PREFIX\bin\gungnir.exe" --version).Trim()
          $tagCore = $env:RELEASE_TAG.Substring(1).Split('-')[0]
          $expectedVersion = "Gungnir $tagCore"

          if ($actualVersion -ne $expectedVersion) {
              throw "Installed CLI reports '$actualVersion'; expected '$expectedVersion'."
          }

      - name: Create archive
        shell: pwsh
        run: |
          Push-Location "$env:GITHUB_WORKSPACE\dist"
          Compress-Archive `
            -Path "$env:GUNGNIR_PACKAGE" `
            -DestinationPath "$env:GITHUB_WORKSPACE\$env:GUNGNIR_PACKAGE.zip" `
            -Force
          Pop-Location

      - name: Upload portable Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86_64
          path: ${{ env.GUNGNIR_PACKAGE }}.zip
          if-no-files-found: error
          retention-days: 7

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Create Windows installer
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $package = "gungnir-v$version-windows-x86_64-setup"

          cpack `
            --config build/CPackConfig.cmake `
            -G NSIS `
            -C Release `
            -B installer `
            -D "CPACK_PACKAGE_FILE_NAME=$package"

          $installer = Join-Path $env:GITHUB_WORKSPACE "installer\$package.exe"

          if (-not (Test-Path $installer)) {
              throw "CPack did not create $installer"
          }

          "GUNGNIR_INSTALLER=$package.exe" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Smoke test Windows installer
        shell: pwsh
        run: |
          $installer = Join-Path $env:GITHUB_WORKSPACE "installer\$env:GUNGNIR_INSTALLER"
          $installDir = Join-Path $env:RUNNER_TEMP "gungnir-installer-smoke"
          $projectDir = Join-Path $env:RUNNER_TEMP "gungnir-installer-app"

          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $projectDir -Recurse -Force -ErrorAction SilentlyContinue

          $install = Start-Process `
            -FilePath $installer `
            -ArgumentList @("/S", "/D=$installDir") `
            -Wait `
            -PassThru

          if ($install.ExitCode -ne 0) {
              throw "Gungnir installer exited with code $($install.ExitCode)"
          }

          $cli = Join-Path $installDir "bin\gungnir.exe"

          if (-not (Test-Path $cli)) {
              throw "Installed gungnir.exe was not found"
          }

          $actualVersion = (& $cli --version).Trim()
          $tagCore = $env:RELEASE_TAG.Substring(1).Split('-')[0]
          $expectedVersion = "Gungnir $tagCore"

          if ($actualVersion -ne $expectedVersion) {
              throw "Installed CLI reports '$actualVersion'; expected '$expectedVersion'."
          }

          Remove-Item Env:GUNGNIR_CMAKE_PREFIX -ErrorAction SilentlyContinue

          & $cli new InstallerSmoke $projectDir
          if ($LASTEXITCODE -ne 0) {
              throw "Installed CLI failed to create a project"
          }

          Push-Location $projectDir
          try {
              & $cli build --release
              if ($LASTEXITCODE -ne 0) {
                  throw "Installed CLI failed to build a generated project without GUNGNIR_CMAKE_PREFIX"
              }
          }
          finally {
              Pop-Location
          }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-installer
          path: installer/${{ env.GUNGNIR_INSTALLER }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs:
      - build-linux
      - build-windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum gungnir-* > SHA256SUMS.txt

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; uploading assets."
            gh release upload "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            exit 0
          fi

          version="${RELEASE_TAG#v}"
          prerelease=()

          if [[ "$version" == 0.* || "$version" == *-* ]]; then
            prerelease+=(--prerelease)
          fi

          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Gungnir $RELEASE_TAG" \
            --generate-notes \
            "${prerelease[@]}"
