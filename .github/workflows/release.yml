name: Release

on:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/gungnir/language/spec.hpp"
      - "tests/release_smoke.py"
      - "tests/sdk_application.py"
      - "src/cli/**"
      - "tools/wait_release_checks.py"
      - ".github/workflows/release.yml"
  push:
    branches:
      - main
    paths:
      - "CMakeLists.txt"
      - ".github/workflows/release.yml"
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to package, for example v1.0.0
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  identity:
    name: Release identity
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      source: ${{ steps.identity.outputs.source }}
      enabled: ${{ steps.identity.outputs.enabled }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
      - name: Resolve pinned release identity
        id: identity
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -nE 's/^set\(GUNGNIR_RELEASE_CHANNEL "([^"]*)"\).*/\1/p' CMakeLists.txt)"
          if [[ "$channel" != stable ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 tools/check_development_contract.py
          version="$(sed -nE 's/^project\(gungnir VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          tag="v$version"
          if [[ -n "$REQUESTED_TAG" && "$REQUESTED_TAG" != "$tag" ]]; then
            echo "Requested tag differs from source version"
            exit 1
          fi
          # Development after a published release must not republish that tag.
          # Explicit tag and manual releases retain their immutable-tag checks.
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "Release $tag already exists; continuing post-release development"
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              exit 0
            else
              result=$?
              if [[ "$result" != 2 ]]; then exit "$result"; fi
            fi
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: identity
    if: needs.identity.outputs.enabled == 'true'
    env:
      RELEASE_TAG: ${{ needs.identity.outputs.tag }}
    name: Package · Linux x86_64 · ${{ matrix.profile }}
    strategy:
      fail-fast: false
      matrix:
        profile: [core, application]
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.identity.outputs.source }}

      - name: Validate tag version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Release tag must be a stable SemVer tag, for example v1.0.0."
            exit 1
          fi

          tag_version="${BASH_REMATCH[1]}"
          cmake_version="$(
            sed -nE 's/^[[:space:]]*project\(gungnir VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt
          )"

          if [[ -z "$cmake_version" ]]; then
            echo "Unable to read the Gungnir version from CMakeLists.txt."
            exit 1
          fi

          if [[ "$tag_version" != "$cmake_version" ]]; then
            echo "Tag version $tag_version does not match CMake project version $cmake_version."
            exit 1
          fi

          release_channel="$(
            sed -nE 's/^[[:space:]]*set\(GUNGNIR_RELEASE_CHANNEL "([^"]*)".*/\1/p' CMakeLists.txt
          )"

          if [[ "$release_channel" != "stable" ]]; then
            echo "Refusing to publish: source release channel is '$release_channel', not stable."
            exit 1
          fi

          if [[ "$RELEASE_TAG" != "v${cmake_version}" ]]; then
            echo "Release tag $RELEASE_TAG does not match stable source version v${cmake_version}."
            exit 1
          fi

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libsqlite3-dev libssl-dev

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGUNGNIR_BUILD_TESTS=OFF
          -DGUNGNIR_BUILD_TOOLS=ON
          -DGUNGNIR_APPLICATION_SDK=${{ matrix.profile == 'application' && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build --parallel 2

      - name: Install
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          package="gungnir-v${version}-linux-x86_64"
          if [[ "${{ matrix.profile }}" == application ]]; then package+="-application"; fi
          prefix="$GITHUB_WORKSPACE/dist/$package"

          cmake --install build --prefix "$prefix"
          cp README.md LICENSE "$prefix/"

          echo "GUNGNIR_PACKAGE=$package" >> "$GITHUB_ENV"
          echo "GUNGNIR_PREFIX=$prefix" >> "$GITHUB_ENV"

      - name: Smoke test installed package
        shell: bash
        run: |
          set -euo pipefail

          cmake -S tests/install_smoke -B install-smoke-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GUNGNIR_PREFIX"
          cmake --build install-smoke-build --parallel 2

          ./install-smoke-build/gungnir_install_smoke
          python3 tests/release_smoke.py "$GUNGNIR_PREFIX"
          python3 tests/sdk_application.py "$GUNGNIR_PREFIX"

          actual_version="$("$GUNGNIR_PREFIX/bin/gungnir" --version)"
          release_version="${RELEASE_TAG#v}"
          expected_version="Gungnir $release_version"

          if [[ "$actual_version" != "$expected_version" ]]; then
            echo "Installed CLI reports '$actual_version'; expected '$expected_version'."
            exit 1
          fi

          compiler_version="$("$GUNGNIR_PREFIX/bin/gungnirc" --version)"
          expected_compiler="Gungnir compiler $release_version (language 1.0)"
          if [[ "$compiler_version" != "$expected_compiler" ]]; then
            echo "Installed compiler reports '$compiler_version'; expected '$expected_compiler'."
            exit 1
          fi

          contract="$("$GUNGNIR_PREFIX/bin/gungnirc" --print-contract)"
          grep -qx "package_version=$release_version" <<< "$contract"
          grep -qx "language_version=1.0" <<< "$contract"
          grep -qx "compiler_contract=1.0" <<< "$contract"
          grep -qx "diagnostic_contract=1.0" <<< "$contract"
          grep -qx "structured_feature_freeze=true" <<< "$contract"
          grep -qx "compatibility=stable" <<< "$contract"

      - name: Create archive
        shell: bash
        run: |
          set -euo pipefail
          tar -C "$GITHUB_WORKSPACE/dist" \
            -czf "$GITHUB_WORKSPACE/${GUNGNIR_PACKAGE}.tar.gz" \
            "$GUNGNIR_PACKAGE"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64-${{ matrix.profile }}
          path: ${{ env.GUNGNIR_PACKAGE }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-windows:
    needs: identity
    if: needs.identity.outputs.enabled == 'true'
    env:
      RELEASE_TAG: ${{ needs.identity.outputs.tag }}
    name: Package · Windows x86_64 · ${{ matrix.profile }}
    strategy:
      fail-fast: false
      matrix:
        profile: [core, application]
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.identity.outputs.source }}

      - name: Validate tag version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+)$') {
              throw "Release tag must be a stable SemVer tag, for example v1.0.0."
          }
          $tagVersion = $Matches[1]
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\(gungnir VERSION (\d+\.\d+\.\d+)') {
              throw "Unable to read the Gungnir version from CMakeLists.txt."
          }
          $cmakeVersion = $Matches[1]
          if ($tagVersion -ne $cmakeVersion) {
              throw "Tag version $tagVersion does not match CMake project version $cmakeVersion."
          }
          if ($cmake -notmatch 'set\(GUNGNIR_RELEASE_CHANNEL "([^"]*)"\)') {
              throw "Unable to read the Gungnir release channel."
          }
          if ($Matches[1] -ne "stable") {
              throw "Refusing to publish: source release channel is not stable."
          }

      - name: Build static application dependencies
        if: matrix.profile == 'application'
        shell: pwsh
        run: ./cmake/windows/BuildApplicationDependencies.ps1 -WorkDir "$env:RUNNER_TEMP/gungnir-application-deps"

      - name: Configure
        run: >
          cmake -S . -B build -A x64
          -DGUNGNIR_BUILD_TESTS=OFF
          -DGUNGNIR_BUILD_TOOLS=ON
          -DGUNGNIR_APPLICATION_SDK=${{ matrix.profile == 'application' && 'ON' || 'OFF' }}
          "-DCMAKE_PREFIX_PATH=${{ env.GUNGNIR_APPLICATION_DEPS }}"
          "-DOPENSSL_ROOT_DIR=${{ env.GUNGNIR_APPLICATION_DEPS }}"

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Install
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $package = "gungnir-v$version-windows-x86_64"
          if ('${{ matrix.profile }}' -eq 'application') { $package += '-application' }
          $prefix = Join-Path $env:GITHUB_WORKSPACE "dist\$package"

          cmake --install build --config Release --prefix "$prefix"
          Copy-Item README.md, LICENSE -Destination "$prefix"

          "GUNGNIR_PACKAGE=$package" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GUNGNIR_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Smoke test installed package
        shell: pwsh
        run: |
          cmake -S tests/install_smoke -B install-smoke-build -A x64 `
            "-DCMAKE_PREFIX_PATH=$env:GUNGNIR_PREFIX"
          cmake --build install-smoke-build --config Release --parallel 2

          & "./install-smoke-build/Release/gungnir_install_smoke.exe"
          if ($LASTEXITCODE -ne 0) { throw "Installed package consumer failed" }
          python tests/release_smoke.py "$env:GUNGNIR_PREFIX"
          if ($LASTEXITCODE -ne 0) { throw "Installed application smoke failed" }
          python tests/sdk_application.py "$env:GUNGNIR_PREFIX"
          if ($LASTEXITCODE -ne 0) { throw "Installed database/auth application smoke failed" }

          $actualVersion = (& "$env:GUNGNIR_PREFIX\bin\gungnir.exe" --version).Trim()
          $releaseVersion = $env:RELEASE_TAG.Substring(1)
          $expectedVersion = "Gungnir $releaseVersion"

          if ($actualVersion -ne $expectedVersion) {
              throw "Installed CLI reports '$actualVersion'; expected '$expectedVersion'."
          }

          $compilerVersion = (& "$env:GUNGNIR_PREFIX\bin\gungnirc.exe" --version).Trim()
          $expectedCompiler = "Gungnir compiler $releaseVersion (language 1.0)"
          if ($compilerVersion -ne $expectedCompiler) {
              throw "Installed compiler reports '$compilerVersion'; expected '$expectedCompiler'."
          }

          $contract = (& "$env:GUNGNIR_PREFIX\bin\gungnirc.exe" --print-contract) -join "`n"
          foreach ($required in @(
              "package_version=$releaseVersion",
              "language_version=1.0",
              "compiler_contract=1.0",
              "diagnostic_contract=1.0",
              "structured_feature_freeze=true",
              "compatibility=stable"
          )) {
              if ($contract -notmatch [regex]::Escape($required)) {
                  throw "Installed compiler contract is missing '$required'."
              }
          }

      - name: Create archive
        shell: pwsh
        run: |
          Push-Location "$env:GITHUB_WORKSPACE\dist"
          Compress-Archive `
            -Path "$env:GUNGNIR_PACKAGE" `
            -DestinationPath "$env:GITHUB_WORKSPACE\$env:GUNGNIR_PACKAGE.zip" `
            -Force
          Pop-Location

      - name: Upload portable Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86_64-${{ matrix.profile }}
          path: ${{ env.GUNGNIR_PACKAGE }}.zip
          if-no-files-found: error
          retention-days: 7

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Create Windows installer
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $package = "gungnir-v$version-windows-x86_64-setup"
          if ('${{ matrix.profile }}' -eq 'application') { $package = "gungnir-v$version-windows-x86_64-application-setup" }

          cpack `
            --config build/CPackConfig.cmake `
            -G NSIS `
            -C Release `
            -B installer `
            -D "CPACK_PACKAGE_FILE_NAME=$package"

          $installer = Join-Path $env:GITHUB_WORKSPACE "installer\$package.exe"

          if (-not (Test-Path $installer)) {
              throw "CPack did not create $installer"
          }

          "GUNGNIR_INSTALLER=$package.exe" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Smoke test Windows installer with long PATH
        shell: pwsh
        run: |
          $installer = Join-Path $env:GITHUB_WORKSPACE "installer\$env:GUNGNIR_INSTALLER"
          $installDir = Join-Path $env:RUNNER_TEMP "gungnir-installer-smoke"
          $projectDir = Join-Path $env:RUNNER_TEMP "gungnir-installer-app"
          $originalUserPath = [Environment]::GetEnvironmentVariable("Path", "User")

          $longEntries = 1..140 | ForEach-Object {
              "C:\release-path-segment-$($_.ToString('000'))\bin"
          }
          $longUserPath = [string]::Join(';', $longEntries)

          try {
              [Environment]::SetEnvironmentVariable(
                  "Path",
                  $longUserPath,
                  "User"
              )

              Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
              Remove-Item $projectDir -Recurse -Force -ErrorAction SilentlyContinue

              $install = Start-Process `
                -FilePath $installer `
                -ArgumentList @("/S", "/D=$installDir") `
                -Wait `
                -PassThru

              if ($install.ExitCode -ne 0) {
                  throw "Gungnir installer exited with code $($install.ExitCode)"
              }

              $cli = Join-Path $installDir "bin\gungnir.exe"
              if (-not (Test-Path $cli)) {
                  throw "Installed gungnir.exe was not found"
              }

              $expectedBin = (Join-Path $installDir "bin").TrimEnd('\')
              $installedUserPath = [Environment]::GetEnvironmentVariable("Path", "User")
              $pathEntries = $installedUserPath -split ';' |
                ForEach-Object { $_.Trim().Trim('"').TrimEnd('\') }

              if ($pathEntries -notcontains $expectedBin) {
                  throw "Installer did not add Gungnir to the current user's PATH"
              }

              if (-not $installedUserPath.StartsWith(
                  $longUserPath,
                  [StringComparison]::OrdinalIgnoreCase
              )) {
                  throw "Installer changed or truncated the existing long user PATH"
              }

              $actualVersion = (& $cli --version).Trim()
              $releaseVersion = $env:RELEASE_TAG.Substring(1).Split('-')[0]
              $expectedVersion = "Gungnir $releaseVersion"

              if ($actualVersion -ne $expectedVersion) {
                  throw "Installed CLI reports '$actualVersion'; expected '$expectedVersion'."
              }

              $compiler = Join-Path $installDir "bin\gungnirc.exe"
              if (-not (Test-Path $compiler)) {
                  throw "Installed gungnirc.exe was not found"
              }

              $compilerVersion = (& $compiler --version).Trim()
              $expectedCompiler = "Gungnir compiler $releaseVersion (language 1.0)"
              if ($compilerVersion -ne $expectedCompiler) {
                  throw "Installed compiler reports '$compilerVersion'; expected '$expectedCompiler'."
              }

              $contract = (& $compiler --print-contract) -join "`n"
              foreach ($required in @(
                  "package_version=$releaseVersion",
                  "language_version=1.0",
                  "compiler_contract=1.0",
                  "diagnostic_contract=1.0",
                  "structured_feature_freeze=true",
                  "compatibility=stable"
              )) {
                  if ($contract -notmatch [regex]::Escape($required)) {
                      throw "Installed compiler contract is missing '$required'."
                  }
              }

              Remove-Item Env:GUNGNIR_CMAKE_PREFIX -ErrorAction SilentlyContinue

              & $cli new InstallerSmoke $projectDir
              if ($LASTEXITCODE -ne 0) {
                  throw "Installed CLI failed to create a project"
              }

              Push-Location $projectDir
              try {
                  & $cli build
                  if ($LASTEXITCODE -ne 0) {
                      throw "Installed CLI failed to build a default generated project without GUNGNIR_CMAKE_PREFIX"
                  }
              }
              finally {
                  Pop-Location
              }

              python tests/sdk_application.py "$installDir"
              if ($LASTEXITCODE -ne 0) { throw "Windows installer database/auth application failed" }

              $uninstaller = Join-Path $installDir "Uninstall Gungnir.exe"
              if (-not (Test-Path $uninstaller)) {
                  throw "Gungnir uninstaller was not found"
              }

              $uninstall = Start-Process `
                -FilePath $uninstaller `
                -ArgumentList @("/S") `
                -Wait `
                -PassThru

              if ($uninstall.ExitCode -ne 0) {
                  throw "Gungnir uninstaller exited with code $($uninstall.ExitCode)"
              }

              $afterUninstall = [Environment]::GetEnvironmentVariable("Path", "User")
              if ($afterUninstall -ne $longUserPath) {
                  throw "Uninstaller did not restore the pre-install user PATH"
              }
          }
          finally {
              [Environment]::SetEnvironmentVariable(
                  "Path",
                  $originalUserPath,
                  "User"
              )
          }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-installer-${{ matrix.profile }}
          path: installer/${{ env.GUNGNIR_INSTALLER }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    if: github.event_name != 'pull_request'
    env:
      RELEASE_TAG: ${{ needs.identity.outputs.tag }}
      RELEASE_SOURCE: ${{ needs.identity.outputs.source }}
    timeout-minutes: 30
    needs:
      - identity
      - build-linux
      - build-windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.identity.outputs.source }}
          fetch-depth: 0
      - name: Require exact-commit validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/wait_release_checks.py "$GITHUB_REPOSITORY" "$RELEASE_SOURCE"

      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum gungnir-* > SHA256SUMS.txt

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # Tag the commit that produced both verified SDKs; never replace a tag.
          if git rev-parse --verify --quiet "$RELEASE_TAG^{commit}" >/dev/null; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_SOURCE"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$RELEASE_SOURCE" >/dev/null
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite published assets."
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Gungnir $RELEASE_TAG" \
            --notes-file docs/release-v1.md
