name: Windows Installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/gungnir/**"
      - "src/**"
      - "tools/gungnir.cpp"
      - "tools/gungnirc.cpp"
      - "tests/compiler_release_contract.cmake"
      - "tests/cli_integration.cmake"
      - "tests/generated_project.py"
      - "tests/windows_dev.py"
      - "tests/sdk_application.py"
      - ".github/workflows/release.yml"
      - ".github/workflows/installer-ci.yml"

permissions:
  contents: read

concurrency:
  group: installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Windows setup executable · ${{ matrix.profile }}
    strategy:
      fail-fast: false
      matrix:
        profile: [core, application]
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install NSIS
        shell: pwsh
        run: ./cmake/windows/InstallNsis.ps1 -WorkDir "$env:RUNNER_TEMP/gungnir-nsis"

      - name: Build static application dependencies
        if: matrix.profile == 'application'
        shell: pwsh
        run: ./cmake/windows/BuildApplicationDependencies.ps1 -WorkDir "$env:RUNNER_TEMP/gungnir-application-deps"

      - name: Configure
        run: >
          cmake -S . -B build -A x64
          -DGUNGNIR_BUILD_TESTS=OFF
          -DGUNGNIR_BUILD_TOOLS=ON
          -DGUNGNIR_APPLICATION_SDK=${{ matrix.profile == 'application' && 'ON' || 'OFF' }}
          "-DCMAKE_PREFIX_PATH=${{ env.GUNGNIR_APPLICATION_DEPS }}"
          "-DOPENSSL_ROOT_DIR=${{ env.GUNGNIR_APPLICATION_DEPS }}"

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Create installer
        shell: pwsh
        run: |
          cpack `
            --config build/CPackConfig.cmake `
            -G NSIS `
            -C Release `
            -B installer
          if ($LASTEXITCODE -ne 0) {
              throw "CPack failed to create the Windows installer"
          }

          $installer = Get-ChildItem installer -Filter "gungnir-*-setup.exe" |
            Select-Object -First 1

          if ($null -eq $installer) {
              throw "CPack did not create the Gungnir setup executable"
          }

          "GUNGNIR_INSTALLER=$($installer.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" |
            Set-Content -Path "$($installer.FullName).sha256" -Encoding ascii
          $sourceCommit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Unable to identify the installer source commit" }
          @{
              source_commit = $sourceCommit
              profile = '${{ matrix.profile }}'
              installer = $installer.Name
              sha256 = $hash
              workflow_run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          } | ConvertTo-Json | Set-Content installer/build-info.json -Encoding utf8

      - name: Install with long PATH and build a project
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "Gungnir Installer CI"
          $projectDir = Join-Path $env:RUNNER_TEMP "gungnir-installer-ci-app"
          $originalUserPath = [Environment]::GetEnvironmentVariable("Path", "User")

          $longEntries = 1..140 | ForEach-Object {
              "C:\test-path-segment-$($_.ToString('000'))\bin"
          }
          $longUserPath = [string]::Join(';', $longEntries)

          try {
              [Environment]::SetEnvironmentVariable(
                  "Path",
                  $longUserPath,
                  "User"
              )

              if ($longUserPath.Length -le 1024) {
                  throw "Long PATH fixture did not exceed the historical NSIS limit"
              }

              Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
              Remove-Item $projectDir -Recurse -Force -ErrorAction SilentlyContinue

              $install = Start-Process `
                -FilePath $env:GUNGNIR_INSTALLER `
                -ArgumentList @("/S", "/D=$installDir") `
                -Wait `
                -PassThru

              if ($install.ExitCode -ne 0) {
                  throw "Installer exited with code $($install.ExitCode)"
              }

              $cli = Join-Path $installDir "bin\gungnir.exe"
              if (-not (Test-Path $cli)) {
                  throw "Installed CLI was not found"
              }

              $installedUserPath = [Environment]::GetEnvironmentVariable("Path", "User")
              $expectedBin = (Join-Path $installDir "bin").TrimEnd('\')

              $pathEntries = $installedUserPath -split ';' |
                ForEach-Object { $_.Trim().Trim('"').TrimEnd('\') }

              if ($pathEntries -notcontains $expectedBin) {
                  throw "Installer did not add Gungnir to the current user's PATH"
              }

              if (-not $installedUserPath.StartsWith(
                  $longUserPath,
                  [StringComparison]::OrdinalIgnoreCase
              )) {
                  throw "Installer changed or truncated the existing long user PATH"
              }

              # Upgrade/reinstall the same SDK before exercising the installed
              # tools. It must retain a single PATH entry and a complete SDK.
              $upgrade = Start-Process `
                -FilePath $env:GUNGNIR_INSTALLER `
                -ArgumentList @("/S", "/D=$installDir") `
                -Wait `
                -PassThru
              if ($upgrade.ExitCode -ne 0) {
                  throw "Installer upgrade exited with code $($upgrade.ExitCode)"
              }
              $upgradedUserPath = [Environment]::GetEnvironmentVariable("Path", "User")
              if ($upgradedUserPath -ne $installedUserPath) {
                  throw "Installer upgrade changed or duplicated the existing user PATH"
              }
              if (-not (Test-Path $cli)) { throw "Installer upgrade removed the CLI" }

              $expectedVersion = "Gungnir 1.0.2"
              $actualVersion = (& $cli --version).Trim()

              if ($actualVersion -ne $expectedVersion) {
                  throw "Installed CLI reports '$actualVersion'; expected '$expectedVersion'."
              }

              $compiler = Join-Path $installDir "bin\gungnirc.exe"
              if (-not (Test-Path $compiler)) {
                  throw "Installed compiler was not found"
              }

              $compilerVersion = (& $compiler --version).Trim()
              $expectedCompiler = "Gungnir compiler 1.0.2 (language 1.0)"
              if ($compilerVersion -ne $expectedCompiler) {
                  throw "Installed compiler reports '$compilerVersion'; expected '$expectedCompiler'."
              }

              $contract = (& $compiler --print-contract) -join "`n"
              foreach ($required in @(
                  "package_version=1.0.2",
                  "language_version=1.0",
                  "compiler_contract=1.0",
                  "diagnostic_contract=1.0",
                  "structured_feature_freeze=true",
                  "compatibility=stable"
              )) {
                  if ($contract -notmatch [regex]::Escape($required)) {
                      throw "Installed compiler contract is missing '$required'."
                  }
              }

              Remove-Item Env:GUNGNIR_CMAKE_PREFIX -ErrorAction SilentlyContinue

              & $cli new InstallerCI $projectDir
              if ($LASTEXITCODE -ne 0) {
                  throw "Installed CLI failed to create a project"
              }

              Push-Location $projectDir
              try {
                  & $cli build
                  if ($LASTEXITCODE -ne 0) {
                      throw "Installed CLI failed to build a default development project"
                  }
              }
              finally {
                  Pop-Location
              }

              # Cover the actual Windows CLI watcher, not only launching app.exe.
              # One installed-SDK profile is sufficient for the watcher lifecycle
              # and keeps duplicate native compilations out of the application SDK job.
              if ('${{ matrix.profile }}' -eq 'core') {
                  python tests/windows_dev.py "$cli"
                  if ($LASTEXITCODE -ne 0) { throw "Windows installed-SDK dev watcher acceptance test failed" }
              }

              python tests/sdk_application.py "$installDir"
              if ($LASTEXITCODE -ne 0) { throw "Windows installer database/auth application failed" }

              $uninstaller = Join-Path $installDir "Uninstall Gungnir.exe"
              if (-not (Test-Path $uninstaller)) {
                  throw "Gungnir uninstaller was not found"
              }

              $uninstall = Start-Process `
                -FilePath $uninstaller `
                -ArgumentList @("/S") `
                -Wait `
                -PassThru

              if ($uninstall.ExitCode -ne 0) {
                  throw "Uninstaller exited with code $($uninstall.ExitCode)"
              }

              $afterUninstall = [Environment]::GetEnvironmentVariable("Path", "User")
              $afterEntries = $afterUninstall -split ';' |
                ForEach-Object { $_.Trim().Trim('"').TrimEnd('\') }

              if ($afterEntries -contains $expectedBin) {
                  throw "Uninstaller left Gungnir in the current user's PATH"
              }

              if ($afterUninstall -ne $longUserPath) {
                  throw "Uninstaller did not restore the pre-install user PATH"
              }
          }
          finally {
              [Environment]::SetEnvironmentVariable(
                  "Path",
                  $originalUserPath,
                  "User"
              )
          }

      - name: Upload verified Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: gungnir-windows-x86_64-${{ matrix.profile }}-installer-${{ github.run_id }}
          path: |
            installer/gungnir-*-setup.exe
            installer/gungnir-*-setup.exe.sha256
            installer/build-info.json
          if-no-files-found: error
          retention-days: 30
