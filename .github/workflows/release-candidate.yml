name: Release Candidate

on:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/gungnir/language/**"
      - "include/gungnir/api.hpp"
      - "include/gungnir/gungnir.hpp"
      - "tools/gungnir.cpp"
      - "tools/gungnirc.cpp"
      - "tools/check_release_candidate.py"
      - "tests/compiler_release_contract.cmake"
      - "tests/compiler_stability.cpp"
      - "tests/public_api_contract.cpp"
      - "tests/install_smoke/**"
      - "README.md"
      - "CHANGELOG.md"
      - "docs/stability.md"
      - "docs/native-api-abi.md"
      - "docs/release-candidate.md"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-candidate.yml"
  push:
    branches:
      - main
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/gungnir/language/**"
      - "include/gungnir/api.hpp"
      - "include/gungnir/gungnir.hpp"
      - "tools/gungnir.cpp"
      - "tools/gungnirc.cpp"
      - "tools/check_release_candidate.py"
      - "tests/compiler_release_contract.cmake"
      - "tests/compiler_stability.cpp"
      - "tests/public_api_contract.cpp"
      - "tests/install_smoke/**"
      - "README.md"
      - "CHANGELOG.md"
      - "docs/stability.md"
      - "docs/native-api-abi.md"
      - "docs/release-candidate.md"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-candidate.yml"

permissions:
  contents: read

concurrency:
  group: rc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    name: 1.0 RC package contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate RC metadata
        run: python3 tools/check_release_candidate.py

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure Release package
        run: >
          cmake -S . -B build-rc -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGUNGNIR_BUILD_TESTS=OFF
          -DGUNGNIR_BUILD_TOOLS=ON
          -DGUNGNIR_BUILD_BENCHMARKS=ON

      - name: Build package and benchmark smoke targets
        run: >
          cmake --build build-rc
          --target gungnir gungnir-orm gungnir-language gungnir-cli gungnirc gungnir_benchmarks
          --parallel 2

      - name: Install package
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/gungnir-rc"
          cmake --install build-rc --prefix "$prefix"
          echo "GUNGNIR_RC_PREFIX=$prefix" >> "$GITHUB_ENV"

      - name: Verify installed CLI contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$("$GUNGNIR_RC_PREFIX/bin/gungnir" --version)" = "Gungnir 1.0.0-rc.1"
          test "$("$GUNGNIR_RC_PREFIX/bin/gungnirc" --version)" = "Gungnir compiler 1.0.0-rc.1 (language 1.0)"

          contract="$("$GUNGNIR_RC_PREFIX/bin/gungnirc" --print-contract)"
          grep -qx "package_version=1.0.0-rc.1" <<< "$contract"
          grep -qx "language_version=1.0" <<< "$contract"
          grep -qx "compiler_contract=1.0" <<< "$contract"
          grep -qx "diagnostic_contract=1.0" <<< "$contract"
          grep -qx "structured_feature_freeze=true" <<< "$contract"
          grep -qx "compatibility=stable" <<< "$contract"

      - name: Configure installed-package consumer
        run: >
          cmake -S tests/install_smoke -B rc-consumer -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$GUNGNIR_RC_PREFIX"

      - name: Link and run installed-package consumer
        shell: bash
        run: |
          set -euo pipefail
          cmake --build rc-consumer --parallel 2
          "$PWD/rc-consumer/gungnir_install_smoke"

      - name: Run benchmark contract smoke
        run: >
          python3 benchmarks/run.py
          --build-dir build-rc
          --smoke
          --output rc-benchmark-smoke.json

      - name: Upload RC smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: gungnir-1.0-rc-smoke
          path: rc-benchmark-smoke.json
          if-no-files-found: error
          retention-days: 30
