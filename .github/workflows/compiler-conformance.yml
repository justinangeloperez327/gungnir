name: Compiler Conformance

on:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "include/gungnir/language/**"
      - "src/language/**"
      - "tools/gungnirc.cpp"
      - "tests/compiler_*.cpp"
      - "tests/compiler_*.cmake"
      - "tests/structured_generated.cpp"
      - "tests/structured_http.cpp"
      - "tests/structured_authentication.cpp"
      - "tests/structured_services.cpp"
      - "tests/structured_routing.cpp"
      - "tests/structured_validation.cpp"
      - "tests/structured_background.cpp"
      - "tests/structured_application.cpp"
      - "include/gungnir/validation/**"
      - "src/validation/**"
      - "include/gungnir/http/uploads.hpp"
      - "src/http/uploads.cpp"
      - "include/gungnir/routing/**"
      - "src/routing/**"
      - "tests/structured_request_context.cpp"
      - "tests/model_relationships.cpp"
      - "tests/structured_orm_contract.cpp"
      - "tests/fixtures/structured/**"
      - ".github/workflows/compiler-conformance.yml"
  push:
    branches:
      - main
    paths:
      - "CMakeLists.txt"
      - "include/gungnir/language/**"
      - "src/language/**"
      - "tools/gungnirc.cpp"
      - "tests/compiler_*.cpp"
      - "tests/compiler_*.cmake"
      - "tests/structured_generated.cpp"
      - "tests/structured_http.cpp"
      - "tests/structured_authentication.cpp"
      - "tests/structured_services.cpp"
      - "tests/structured_routing.cpp"
      - "tests/structured_validation.cpp"
      - "tests/structured_background.cpp"
      - "tests/structured_application.cpp"
      - "include/gungnir/validation/**"
      - "src/validation/**"
      - "include/gungnir/http/uploads.hpp"
      - "src/http/uploads.cpp"
      - "include/gungnir/routing/**"
      - "src/routing/**"
      - "tests/structured_request_context.cpp"
      - "tests/model_relationships.cpp"
      - "tests/structured_orm_contract.cpp"
      - "tests/fixtures/structured/**"
      - ".github/workflows/compiler-conformance.yml"

permissions:
  contents: read

concurrency:
  group: compiler-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            cxx: g++
          - name: Clang
            cxx: clang++
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++ clang

      - name: Configure
        env:
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGUNGNIR_BUILD_TESTS=ON
          -DGUNGNIR_BUILD_TOOLS=ON

      - name: Build conformance targets
        run: >
          cmake --build build --parallel 2 --target
          gungnir_public_headers
          gungnir_compiler_correctness_test
          gungnir_compiler_stability_test
          gungnir_compiler_robustness_test
          gungnir_structured_generated_test
          gungnir_model_relationships_test gungnir_structured_orm_contract_test
          gungnir_structured_http_test
          gungnir_structured_authentication_test
          gungnir_structured_services_test
          gungnir_structured_routing_test
          gungnir_structured_validation_test
          gungnir_structured_background_test
          gungnir_structured_application_test
          gungnir_structured_request_context_test
          gungnirc

      - name: Run compiler conformance tests
        run: >
          ctest --test-dir build --output-on-failure --no-tests=error
          -R '^gungnir\.(compiler_correctness|compiler_stability|compiler_robustness|structured_generated|structured_http|structured_authentication|structured_services|structured_routing|structured_validation|structured_background|structured_application|structured_request_context|model_relationships|structured_orm_contract|compiler_profiles_cli|compiler_release_contract|compiler_conformance_snapshot)$'

      - name: Produce deterministic compiler snapshot
        run: >
          cmake
          -DGUNGNIRC=$PWD/build/gungnirc
          -DGUNGNIR_SOURCE_DIR=$PWD
          -DGUNGNIR_OUTPUT_DIR=$PWD/build/conformance
          -P tests/compiler_conformance.cmake

      - name: Upload conformance snapshot
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ matrix.name }}
          path: build/conformance/
          if-no-files-found: error

  msvc:
    name: MSVC
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure
        run: >
          cmake -S . -B build -A x64
          -DGUNGNIR_BUILD_TESTS=ON
          -DGUNGNIR_BUILD_TOOLS=ON

      - name: Build conformance targets
        run: >
          cmake --build build --config Release --parallel 2 --target
          gungnir_public_headers
          gungnir_compiler_correctness_test
          gungnir_compiler_stability_test
          gungnir_compiler_robustness_test
          gungnir_structured_generated_test
          gungnir_model_relationships_test gungnir_structured_orm_contract_test
          gungnir_structured_http_test
          gungnir_structured_authentication_test
          gungnir_structured_services_test
          gungnir_structured_routing_test
          gungnir_structured_validation_test
          gungnir_structured_background_test
          gungnir_structured_application_test
          gungnir_structured_request_context_test
          gungnirc

      - name: Run compiler conformance tests
        run: >
          ctest --test-dir build --build-config Release
          --output-on-failure --no-tests=error
          -R "^gungnir\.(compiler_correctness|compiler_stability|compiler_robustness|structured_generated|structured_http|structured_authentication|structured_services|structured_routing|structured_validation|structured_background|structured_application|structured_request_context|model_relationships|structured_orm_contract|compiler_profiles_cli|compiler_release_contract|compiler_conformance_snapshot)$"

      - name: Produce deterministic compiler snapshot
        shell: pwsh
        run: cmake "-DGUNGNIRC=$PWD/build/Release/gungnirc.exe" "-DGUNGNIR_SOURCE_DIR=$PWD" "-DGUNGNIR_OUTPUT_DIR=$PWD/build/conformance" -P tests/compiler_conformance.cmake

      - name: Upload conformance snapshot
        uses: actions/upload-artifact@v4
        with:
          name: conformance-MSVC
          path: build/conformance/
          if-no-files-found: error

  compare:
    name: Compare compiler output
    runs-on: ubuntu-24.04
    needs:
      - linux
      - msvc
    steps:
      - name: Download conformance snapshots
        uses: actions/download-artifact@v4
        with:
          pattern: conformance-*
          path: snapshots

      - name: Require byte-identical structured output
        shell: bash
        run: |
          set -euo pipefail

          for file in program.cpp program.validated program.ir modules.cpp orm.cpp orm.validated orm.ir http.cpp http.validated http.ir context.cpp context.validated context.ir authentication.cpp authentication.validated authentication.ir services.cpp services.validated services.ir routing.cpp routing.validated routing.ir validation.cpp validation.validated validation.ir background.cpp background.validated background.ir application.cpp application.validated application.ir; do
            cmp "snapshots/conformance-GCC/$file" "snapshots/conformance-Clang/$file"
            cmp "snapshots/conformance-GCC/$file" "snapshots/conformance-MSVC/$file"
          done

          tr -d '\r' < snapshots/conformance-GCC/manifest.txt > gcc.manifest
          tr -d '\r' < snapshots/conformance-Clang/manifest.txt > clang.manifest
          tr -d '\r' < snapshots/conformance-MSVC/manifest.txt > msvc.manifest
          cmp gcc.manifest clang.manifest
          cmp gcc.manifest msvc.manifest
          cat gcc.manifest
